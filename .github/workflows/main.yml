name: Wiz Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write    # summary comment and inline review comments
  security-events: write  # upload SARIF to GitHub code scanning
  actions: read           # needed by the SARIF upload on private repositories

concurrency:
  group: wiz-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Wiz CI/CD policies to evaluate. Include a SAST policy, or code findings are not returned.
  # Each policy's severity threshold and audit/block mode decide whether the check fails.
  WIZ_POLICIES: Default vulnerabilities policy,Default secrets policy,Default software license policy,SRH-Test

jobs:
  wiz-scan:
    name: Wiz scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Wiz CLI
        run: |
          # Keep the binary outside the scanned workspace so its own dependencies are not reported
          curl -fsSL -o "$RUNNER_TEMP/wizcli" https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x "$RUNNER_TEMP/wizcli"
          "$RUNNER_TEMP/wizcli" version

      - name: Run Wiz scan
        id: scan
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          mkdir -p "$RUNNER_TEMP/wiz"
          set +e
          "$RUNNER_TEMP/wizcli" scan dir . \
            --policies "$WIZ_POLICIES" \
            --by-policy-hits=DISABLED \
            --name "github:${{ github.repository }}#${{ github.event.pull_request.number }}" \
            --tags "github/repository=${{ github.repository }}" \
            --tags "github/pull-request=${{ github.event.pull_request.number }}" \
            --tags "github/sha=${{ github.event.pull_request.head.sha }}" \
            --no-color --no-style \
            --json-output-file "$RUNNER_TEMP/wiz/wiz_result.json" \
            --sarif-output-file "$RUNNER_TEMP/wiz/wiz_result.sarif"
          EXIT_CODE=$?
          set -e
          # 0 = passed, 4 = blocked by a policy; anything else means the scan itself failed.
          # Defer failing the job until the report and comments are posted.
          if [ "$EXIT_CODE" -eq 4 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error title=Wiz scan failed::wizcli exited with code $EXIT_CODE"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export WIZ_OUT="$RUNNER_TEMP/wiz"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" | jq -s 'add // []' > "$WIZ_OUT/pr_files.json"
          bash .github/wiz/report.sh
          cat "$WIZ_OUT/comment.md" >> "$GITHUB_STEP_SUMMARY"
          [ -s "$WIZ_OUT/sarif-upload.sarif" ] && echo "sarif=true" >> "$GITHUB_OUTPUT" || true

      - name: Upload results to GitHub code scanning
        if: steps.report.outputs.sarif == 'true'
        continue-on-error: true  # code scanning must be enabled (GitHub Advanced Security on private repos)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/wiz/sarif-upload.sarif
          category: wiz

      - name: Post summary comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The REST API returns the numeric comment ID the PATCH endpoint needs
          EXISTING_COMMENT_ID=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- ID: WIZ_SECURITY_SCAN_COMMENT_MARKER -->")) | .id' | head -n 1)
          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING_COMMENT_ID" -F body=@"$RUNNER_TEMP/wiz/comment.md" > /dev/null
            echo "Updated summary comment $EXISTING_COMMENT_ID"
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/wiz/comment.md" > /dev/null
            echo "Created summary comment"
          fi

      - name: Post inline review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          WIZ_OUT="$RUNNER_TEMP/wiz"
          # Skip findings that already have an inline comment from an earlier run
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/comments" \
            --jq '.[].body | capture("<!-- wiz-finding:(?<key>[^>]*) -->") | .key' > "$WIZ_OUT/seen.txt" || true
          jq --rawfile seen "$WIZ_OUT/seen.txt" '
            ($seen | split("\n")) as $seen
            | [.[] | select((.body | capture("<!-- wiz-finding:(?<key>[^>]*) -->").key) as $key | any($seen[]; . == $key) | not)]
          ' "$WIZ_OUT/review-comments.json" > "$WIZ_OUT/new-comments.json"
          COUNT=$(jq length "$WIZ_OUT/new-comments.json")
          if [ "$COUNT" -eq 0 ]; then
            echo "No new inline findings"
            exit 0
          fi
          jq -n --arg sha "$HEAD_SHA" --slurpfile comments "$WIZ_OUT/new-comments.json" '{
            commit_id: $sha,
            event: "COMMENT",
            body: "🛡️ **Wiz Security Scan** flagged \($comments[0] | length) code \(if ($comments[0] | length) == 1 then "issue" else "issues" end) on lines changed in this pull request. See the summary comment for the full report.",
            comments: $comments[0]
          }' > "$WIZ_OUT/review.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --input "$WIZ_OUT/review.json" > /dev/null \
            && echo "Posted $COUNT inline comments" \
            || echo "::warning title=Inline comments not posted::GitHub rejected the review; findings are still in the summary comment"

      - name: Enforce Wiz policies
        if: steps.scan.outputs.failed == 'true' || steps.scan.outputs.blocked == 'true' || steps.report.outputs.verdict == 'FAILED_BY_POLICY'
        run: |
          if [ "${{ steps.scan.outputs.failed }}" = "true" ]; then
            echo "::error title=Wiz scan failed::The Wiz scan did not complete"
          else
            echo "::error title=Blocked by Wiz policy::Findings in this pull request violate a blocking Wiz policy. See the summary comment."
          fi
          exit 1
