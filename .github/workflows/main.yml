name: Wiz Security Scan

on: [push, pull_request]

jobs:
  wiz-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download WizCLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli

      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"

      - name: Scan IaC templates
        run: ./wizcli iac scan --path .

      # Uncomment to scan a container image instead:
      # - name: Scan container image
      #   run: ./wizcli image scan --image my-image:tag
