name: Wiz Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Required permissions for GITHUB_TOKEN to write and update PR comments
permissions:
  pull-requests: write
  contents: read

jobs:
  wiz-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download WizCLI
        run: |
          curl -Lo wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64
          chmod +x wizcli

      - name: Scan directory & Save JSON
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        # We run the scan and save it to a JSON file.
        # '|| true' ensures that even if findings are discovered, the workflow continues to the comment step.
        run: |
          ./wizcli dir scan --path . --by-policy-hits DISABLED --format json > wiz_result.json || true

      - name: Filter & Format Findings
        id: parse_findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Files touched by this PR; secrets in untouched, pre-existing files are not reported
          gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" --name-only | jq -R . | jq -s -c . > changed_files.json
          # Log the top-level structure to help diagnose schema differences
          jq -c '{keys: (.result // {} | keys)}' wiz_result.json || true
          jq -c '(.result // {}) | to_entries[] | select(.key | test("sast|ruleMatches"; "i")) | {key, sample: (.value | tostring | .[0:1500])}' wiz_result.json || true

          SEV='(.severity // "UNKNOWN" | ascii_upcase)'

          # 1. Vulnerabilities live under libraries[] and osPackages[] (all severities)
          VULNS=$(jq -c "[ (.result | .. | objects | select((.vulnerabilities? | type) == \"array\")) as \$p
            | (\$p.vulnerabilities // [])[]
            | . + {pkgName: \$p.name, pkgVersion: \$p.version, sev: $SEV} ]
            | sort_by(.sev | if . == \"CRITICAL\" then 0 elif . == \"HIGH\" then 1 elif . == \"MEDIUM\" then 2 else 3 end)" wiz_result.json)
          VULN_COUNT=$(echo "$VULNS" | jq 'length')

          # 2. Secrets
          SECRETS=$(jq -c --slurpfile changed changed_files.json "[(.result.secrets // [])[]
            | . + {sev: $SEV, file: (.path // .filename // .filePath // .location.filePath // .location.path // \"\")}
            | select(.file as \$f | \$changed[0] | index(\$f))]" wiz_result.json)
          SECRET_COUNT=$(echo "$SECRETS" | jq 'length')

          # 3. License issues
          LICENSES=$(jq -c "[(.result.licenses // [])[] | . + {sev: $SEV}]" wiz_result.json)
          LICENSE_COUNT=$(echo "$LICENSES" | jq 'length')

          # Wiz nests SAST records differently across CLI output schemas. Find records by their
          # stable rule/weakness fields rather than assuming they are direct arrays under result.
          # SAST results are reported under result.ruleMatches (result.sast is null in current CLI output).
          # Each rule match is expanded to its individual matches (file/line); matches lacking a file are kept
          # with N/A. When file paths are known, only files touched by this PR are reported.
          SAST=$(jq -c --slurpfile changed changed_files.json "[
            ((.result.ruleMatches // []) + ((.result.sast // []) | if type == \"array\" then . else [] end))[]
            | . as \$rm
            | (\$rm.rule // \$rm) as \$r
            | ( [ \$rm | .. | objects | select(
                  (.path? // .filename? // .filePath? // .location.filePath? // .location.path? // null) != null
                ) ] ) as \$locs
            | (if (\$locs | length) > 0 then \$locs else [\$rm] end)[]
            | . as \$i
            | {
                name: (\$r.name // \$r.ruleName // \$r.id // \$i.name // \"SAST Finding\"),
                sev: (\$r.severity // \$i.severity // \"UNKNOWN\" | ascii_upcase),
                file: (\$i.filePath // \$i.filename // \$i.path // \$i.location.filePath // \$i.location.path // \"N/A\"),
                line: (\$i.startLine // \$i.lineNumber // \$i.line // \$i.location.startLine // \$i.location.range.start.line // \$i.range.start.line // \"N/A\"),
                cwe: (([ \$i.weaknesses[]?.id, \$r.cwe, \$r.cwes, \$i.cwe, \$i.cwes ]
                  | map(select(. != null) | if type == \"array\" then join(\", \") else tostring end)
                  | unique | join(\", \"))),
                status: ((\$rm.ignoredPolicyMatches // \$i.ignoredPolicyMatches // [])
                  | map(.ignoreReason // .policy.name // \"Ignored\")
                  | unique
                  | if length == 0 then \"Reported\" else \"Ignored: \" + join(\", \") end)
              }
            | select(.file == \"N/A\" or (.file as \$f | \$changed[0] | index(\$f)))
          ]" wiz_result.json)
          SAST=${SAST:-[]}
          SAST_COUNT=$(echo "$SAST" | jq 'length')

          TOTAL_FINDINGS=$((VULN_COUNT + SECRET_COUNT + LICENSE_COUNT + SAST_COUNT))

          # Initialize the Markdown comment with a hidden tracking ID
          echo "<!-- ID: WIZ_SECURITY_SCAN_COMMENT_MARKER -->" > comment.md
          echo "### 🛡️ Wiz Security Scan Results" >> comment.md
          echo "---" >> comment.md

          # Format SAST Table (Static Code Analysis)
          if [ "$SAST_COUNT" -gt 0 ]; then
            echo "#### 🛡️ Code Security (SAST)" >> comment.md
            echo "| Vulnerability / Rule | File Path | Line | Severity | CWE | Policy Status |" >> comment.md
            echo "|---|---|---|---|---|---|" >> comment.md
            echo "$SAST" | jq -r '.[] | "| \(.name) | \(.file) | \(.line) | **\(.sev)** | \(if .cwe == "" then "N/A" else .cwe end) | \(.status) |"' >> comment.md
            echo "" >> comment.md
          fi

          # Format Vulnerabilities Table (Libraries)
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "#### 📦 Dependency Vulnerabilities (Libraries)" >> comment.md
            echo "| Name | CVE | Severity | Version | Fixed Version |" >> comment.md
            echo "|---|---|---|---|---|" >> comment.md
            echo "$VULNS" | jq -r '.[] | "| \(.pkgName // .name) | \(.name // .id) | **\(.sev)** | \(.pkgVersion // "N/A") | \(.fixedVersion // "N/A") |"' >> comment.md
            echo "" >> comment.md
          fi

          # Format Secrets Table
          if [ "$SECRET_COUNT" -gt 0 ]; then
            echo "#### 🔑 Exposed Secrets" >> comment.md
            echo "| Description | Path | Severity | Snippet |" >> comment.md
            echo "|---|---|---|---|" >> comment.md
            echo "$SECRETS" | jq -r '.[] | "| \(.ruleName // .description) | \(.file) | **\(.sev)** | `\(.snippet // .location.snippet // "REDACTED")` |"' >> comment.md
            echo "" >> comment.md
          fi

          # Format Licenses Table
          if [ "$LICENSE_COUNT" -gt 0 ]; then
            echo "#### 📜 Restrictive Licenses" >> comment.md
            echo "| Rule Name | Component | Severity | Licenses |" >> comment.md
            echo "|---|---|---|---|" >> comment.md
            echo "$LICENSES" | jq -r '.[] | "| \(.ruleName) | \(.componentName) v\(.componentVersion) | **\(.sev)** | \(.licenses // "N/A") |"' >> comment.md
            echo "" >> comment.md
          fi

          # Fallback if no issues of interest were found
          if [ "$TOTAL_FINDINGS" -eq 0 ]; then
            echo "<!-- ID: WIZ_SECURITY_SCAN_COMMENT_MARKER -->" > comment.md
            echo "✨ **No issues found.** Great job!" >> comment.md
          fi

      - name: Post or Update PR Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Use gh to find if we've already commented on this PR
          EXISTING_COMMENT_ID=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[] | select(.body | contains("<!-- ID: WIZ_SECURITY_SCAN_COMMENT_MARKER -->")) | .id' | head -n 1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing comment (ID: $EXISTING_COMMENT_ID)..."
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT_ID" -F body=@comment.md
          else
            echo "No existing comment found. Creating a new one..."
            gh pr comment "$PR_NUMBER" --body-file comment.md
          fi
