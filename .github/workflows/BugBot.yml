name: Bug Bot
description: A GitHub Actions workflow that feeds issue context to GitHub Copilot to automate PR generation.

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  copilot-agent:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Context and Invoke Copilot
        env:
          PR_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_REF: ${{ github.event.repository.default_branch }}
        run: |
          # 1. Determine target branch context
          REF="$PR_REF"
          if [ -z "$REF" ]; then
            REF="$DEFAULT_REF"
          fi

          # 2. Extract issue elements safely from the GitHub JSON event file
          TITLE=$(jq -r '.issue.title // .pull_request.title // ""' "$GITHUB_EVENT_PATH")
          BODY=$(jq -r '.issue.body // .pull_request.body // ""' "$GITHUB_EVENT_PATH")
          COMMENT=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
          
          # 3. Assemble a rich prompt combining the alert information and your trigger
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg comment "$COMMENT" \
            --arg base_ref "$REF" \
            '{
               prompt: ("Please resolve the following issue by staging the requested modifications.\n\nIssue Title: " + $title + "\n\nRemediation Instructions:\n" + $body + "\n\nUser Trigger Command: " + $comment),
               base_ref: $base_ref,
               create_pull_request: true
             }')
          
          # 4. Hand off the compiled bundle to the Copilot Cloud Agent API
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.COPILOT_AGENT_PAT }}" \
            https://api.github.com/agents/repos/${{ github.repository }}/tasks \
            -d "$PAYLOAD"
