name: Bug Bot
description: A GitHub Actions workflow that intercepts @claude tags and invokes GitHub Copilot instead.

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  copilot-agent:
    # Keeps the @claude listener intact so it catches the Wiz tool's tags
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Prompt and Target Branch
        env:
          EVENT_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_REF: ${{ github.event.repository.default_branch }}
        run: |
          # Determine the base branch context
          REF="$PR_REF"
          if [ -z "$REF" ]; then
            REF="$DEFAULT_REF"
          fi
          echo "TARGET_REF=$REF" >> $GITHUB_ENV
          
          # Safely map the multi-line comment/issue text into environment variables
          echo "AGENT_PROMPT<<EOF" >> $GITHUB_ENV
          echo "$EVENT_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Invoke GitHub Copilot Cloud Agent
        run: |
          # Build a secure JSON payload using jq to handle special characters safely
          PAYLOAD=$(jq -n --arg prompt "$AGENT_PROMPT" --arg base_ref "$TARGET_REF" '{prompt: $prompt, base_ref: $base_ref, create_pull_request: true}')
          
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.COPILOT_AGENT_PAT }}" \
            https://api.github.com/agents/repos/${{ github.repository }}/tasks \
            -d "$PAYLOAD"
